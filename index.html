<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Primeiro emprego: por onde começar?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;700;800&family=Oswald:wght@500;700&display=swap">
<style>
:root{--d:#2b1259;--m:#5b2fb0;--l:#cdb8f7;--l2:#efe8fd;--ink:#1f1637;--mu:#4d4566;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:#fff;color:var(--ink);font-family:Nunito,system-ui,sans-serif;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
.book{position:relative;height:calc(100% - 58px);perspective:1800px;overflow:hidden;background:#d8cfee}
.pg{position:absolute;inset:0;overflow-y:auto;padding:22px 22px 18px 40px;background:#fff;transform-origin:left center;backface-visibility:hidden;transition:transform .8s cubic-bezier(.5,0,.2,1),visibility 0s}
.pg.off{transform:rotateY(-105deg);visibility:hidden;transition:transform .8s cubic-bezier(.5,0,.2,1),visibility 0s .8s}
.spiral{position:absolute;left:0;top:0;bottom:0;width:26px;z-index:99;pointer-events:none;background:radial-gradient(circle at 13px 14px,#2b2b2b 0 4px,#bdb7a2 5px 7px,transparent 8px) 0 0/26px 28px repeat-y,linear-gradient(90deg,rgba(0,0,0,.18),transparent)}
.in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;min-height:100%}
.hand{font-family:Caveat,"Comic Sans MS",cursive}
.ft{margin-top:auto;padding-top:22px;text-align:center}.ft img{height:30px;width:auto}
.tag{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.tag b{flex:none;width:46px;height:46px;border-radius:50%;background:var(--d);color:#fff;display:grid;place-items:center;font:700 24px Oswald,sans-serif}
.tag h2{margin:0;background:var(--l);padding:7px 14px;border-radius:6px 28px 8px 22px;font:700 21px/1.1 Oswald,sans-serif;text-transform:uppercase;color:var(--d)}
.tag i{margin-left:auto;font-style:normal;font-size:32px}
.sub2{display:inline-block;background:var(--l);color:var(--d);padding:3px 14px;border-radius:6px 20px 6px 16px;font:700 24px Caveat,cursive;margin:12px 0 6px}
.lead{margin:0 0 12px;line-height:1.45}
p{line-height:1.4;margin:0 0 8px}
ul.ck{list-style:none;margin:0;padding:0}
.ck li label{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #e3dcf3;cursor:pointer;line-height:1.3}
.ck li:last-child label{border:0}
.ck input{appearance:none;flex:none;width:24px;height:24px;margin:2px 0 0;border:2px solid var(--d);border-radius:5px;background:#fff;display:grid;place-items:center}
.ck input:checked{background:var(--m);border-color:var(--m)}
.ck input:checked::after{content:"✓";color:#fff;font-weight:800;font-size:16px}
.ck input:focus-visible,button:focus-visible{outline:3px solid var(--m);outline-offset:2px}
.ck strong{display:block;font-size:16px;color:var(--d)}.ck span{font-size:14px;color:var(--mu)}
.ck input:checked+div strong{text-decoration:line-through;text-decoration-thickness:2px}
ul.bl{margin:0 0 6px;padding:0 0 0 4px;list-style:none}
ul.bl li{padding:4px 0 4px 30px;position:relative;font-size:15px;line-height:1.3}
ul.bl li::before{position:absolute;left:0;top:3px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff}
ul.y li::before{content:"✓";background:var(--m)}ul.n li::before{content:"✕";background:var(--d)}
.note{margin:16px 0 0;padding:12px 16px;background:var(--l);color:var(--d);border-radius:18px 8px 22px 10px;font:600 22px/1.1 Caveat,cursive;transform:rotate(-1.5deg);text-align:center}
.tb{border:2px solid var(--m);border-radius:10px;overflow:hidden;margin-bottom:4px}
.tb .th{display:grid;grid-template-columns:104px 1fr;background:var(--m);color:#fff;font:500 15px Oswald,sans-serif;text-transform:uppercase;padding:8px 10px;gap:8px}
.tb .tr{display:grid;grid-template-columns:104px 1fr;gap:8px;padding:10px;border-top:1px solid #e3dcf3;font-size:14px;line-height:1.3}
.tb .tr b{display:flex;flex-direction:column;gap:4px;color:var(--d);font-size:14px}.tb .tr b i{font-style:normal;font-size:24px}
.cover{background:radial-gradient(circle at 88% 6%,#4a2a8f 0 90px,transparent 91px),radial-gradient(circle at 8% 96%,#4a2a8f 0 130px,transparent 131px),var(--d);color:#fff}
.cover .ct{font-size:26px;line-height:1;transform:rotate(-5deg);width:max-content;max-width:90%;margin:4px 0 22px}
h1{margin:0;font:700 clamp(44px,15vw,68px)/.95 Oswald,sans-serif;text-transform:uppercase;transform:rotate(-4deg);transform-origin:left}
h1 span{display:inline-block;background:var(--l);color:var(--d);padding:0 10px;margin-top:4px}
.cover .sub{font-size:38px;margin:22px 0 6px;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px;transform:rotate(-4deg)}
.desc{font-size:17px;line-height:1.45;margin:14px 0}
.sc{font-size:64px;text-align:center;margin:6px 0}
.cover .note{align-self:flex-start;max-width:240px;text-align:left}
.hint{margin-top:14px;font-size:14px;opacity:.85}
.cover .ft img{filter:drop-shadow(0 0 1px #fff) drop-shadow(0 0 2px #fff) drop-shadow(0 0 3px #fff)}
.btn{display:block;width:100%;margin:12px 0 0;padding:14px;border:0;border-radius:14px;background:var(--d);color:#fff;font:700 18px Nunito,sans-serif;cursor:pointer}
.btn.b2{background:var(--m)}.btn:disabled{opacity:.45}
.btn.lt{background:var(--l);color:var(--d)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.opts .btn{margin:0}
.how{margin:0 0 6px;padding-left:22px;line-height:1.6}
.prog{font-size:13px;color:var(--mu);font-weight:700;margin-bottom:10px}
.bar{height:8px;border-radius:4px;background:var(--l2);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--m)}
.qt{font-size:21px;line-height:1.3;margin:6px 0 4px;color:var(--d)}
.fb{margin-top:16px;padding:14px;border-radius:12px;font-size:15px;line-height:1.4}
.fb.ok{background:#e0f3e6;border:2px solid #2e8b57}.fb.no{background:#fbe4e1;border:2px solid #c0392b}
.fb p{margin:6px 0 0}
.big{font:700 64px Oswald,sans-serif;color:var(--m);text-align:center;margin:10px 0 0}
.nav{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#fff}
.nav button{width:44px;height:44px;border:2px solid var(--d);border-radius:50%;background:#fff;font-size:20px;color:var(--d);cursor:pointer}
.nav button:disabled{opacity:.3}
.dots{display:flex;gap:5px}
.dots button{width:10px;height:10px;padding:0;border:2px solid var(--d);border-radius:50%;background:transparent;cursor:pointer}
.dots button[aria-current=true]{background:var(--d)}
@media(prefers-reduced-motion:reduce){.pg,.pg.off{transition:none!important}}

.warn{background:var(--l2);border-left:5px solid var(--m);border-radius:8px;padding:10px 12px;margin:12px 0;font-size:15px;line-height:1.35}.warn>b{display:block;margin-bottom:4px;color:var(--d)}.warn p{margin:2px 0}
.tip{background:#fff6d6;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:15px;line-height:1.35}
.ex{border:2px dashed var(--l);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:15px;line-height:1.35}.ex p{margin:2px 0}
.q{background:var(--d);color:#fff;border-radius:12px;padding:10px 14px;margin:10px 0 0;font-size:15px;line-height:1.35}
.cv{border:2px solid var(--m);border-radius:10px;padding:12px;font-size:13px;line-height:1.35;margin-bottom:12px;word-break:break-word}.cv h4{margin:0 0 2px;font:700 18px Oswald,sans-serif;color:var(--d)}.cv h5{margin:9px 0 2px;font:700 13px Oswald,sans-serif;color:var(--m);text-transform:uppercase;letter-spacing:.3px}.cv p{margin:0;font-size:13px}
.cv.bad{border-color:#c0392b;background:#fdf1ef}.cv.bad h5{color:#c0392b}
.red{background:#fbe4e1;border-radius:12px;padding:12px;margin-bottom:12px}.grn{background:#e0f3e6;border-radius:12px;padding:12px}
.red h3,.grn h3{margin:0 0 6px;font:700 20px Oswald,sans-serif;text-transform:uppercase}.red h3{color:#a5301f}.grn h3{color:#1f6b42}
.red ul.n li::before{background:#c0392b}.grn ul.y li::before{background:#2e8b57}
.cover ul.bl li{color:#fff}.cover ul.y li::before{background:var(--l);color:var(--d)}.cover .sub2{margin-top:18px}
.rem{background:var(--d);color:#fff;border-radius:14px;padding:16px;margin-top:16px}.rem h3{margin:0 0 8px;font:700 24px Oswald,sans-serif;color:var(--l);text-transform:uppercase}.rem p{margin:0 0 8px;line-height:1.4;font-size:15px}

.grn{margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chip span{display:block;padding:7px 12px;border:2px solid var(--l);border-radius:20px;font-size:14px;font-weight:700;background:#fff;color:var(--d)}
.chip input:checked+span{background:var(--m);border-color:var(--m);color:#fff}
.chip input:focus-visible+span{outline:3px solid var(--m);outline-offset:2px}
.fl{display:block;font-weight:800;color:var(--d);margin:8px 0}
.fld{display:block;width:100%;border:0;border-bottom:2px solid var(--m);padding:8px 2px;font:700 16px Nunito,sans-serif;color:var(--d);background:transparent;border-radius:0}
.fld:focus-visible{outline:3px solid var(--m)}

html{background:radial-gradient(circle at 90% 5%,#4a2a8f 0 120px,transparent 121px),radial-gradient(circle at 4% 96%,#4a2a8f 0 170px,transparent 171px),#2b1259}
body{background:transparent;max-width:560px;margin:0 auto}
@media(min-width:600px){body{box-shadow:0 0 50px rgba(0,0,0,.5)}}
.nav{background:var(--d)}
.nav button{background:transparent;border-color:#fff;color:#fff}
.nav button:focus-visible,.dots button:focus-visible{outline-color:var(--l)}
.dots button{border-color:#fff}.dots button[aria-current=true]{background:#fff}
</style>
</head>
<body>
<main class="book" id="book"><div class="spiral" aria-hidden="true"></div></main>
<nav class="nav" aria-label="Navegação do livreto">
<button id="prev" aria-label="Página anterior">‹</button><div class="dots" id="dots"></div><button id="next" aria-label="Próxima página">›</button>
</nav>

var qa=[['Fale um pouco sobre você.','Sou uma pessoa organizada, gosto de aprender e tenho interesse em desenvolver minha carreira na área. Procuro colaborar com a equipe, cumprir prazos e buscar soluções.'],['Quais são seus pontos fortes?','Tenho boa comunicação, sou proativo(a), aprendo rápido e gosto de trabalhar em equipe. (Escolha 2 ou 3 habilidades reais e conte uma situação em que as usou.)'],['E seus pontos de melhoria?','Estou sempre buscando me organizar melhor com o tempo e aprimorar meus conhecimentos. (Cite algo verdadeiro que esteja melhorando.)'],['Por que quer trabalhar aqui?','Acompanho o trabalho da empresa e admiro seus valores. Acredito que posso contribuir com minha dedicação e também aprender muito.'],['Onde você se vê daqui a 5 anos?','Quero me desenvolver profissionalmente, assumir novos desafios e crescer junto com a empresa.'],['Qual é a sua pretensão salarial?','Pesquisei a faixa para essa função e minha pretensão está alinhada com a vaga, os benefícios e a jornada. Estou aberto(a) a conversar.'],['Por que saiu do último emprego?','Responda com profissionalismo e foco no futuro, sem transformar a entrevista em uma reclamação.']];

T(1,'Todo mundo começa de algum lugar','🌱')+'<p class="lead">Não existe idade errada para o primeiro emprego; o importante é dar o primeiro passo.</p>'+B(['<b>Descubra o que você já sabe fazer.</b> Cuidar da casa e de pessoas, cozinhar, vender, organizar, ajudar na comunidade: tudo isso são habilidades.','<b>Organize o básico.</b> Documentos em ordem (RG, CPF, comprovante de residência), Carteira de Trabalho Digital, telefone e e-mail ativos.','<b>Defina o que você procura.</b> Tipo de trabalho, horário possível e distância de casa.','<b>Saiba onde procurar.</b> Canais confiáveis (sites de vagas e agências de emprego), indicação de conhecidos e empresas do bairro. Cursos gratuitos ou de baixo custo ajudam a ganhar confiança.','<b>Cuidado com golpes.</b> Nunca pague para conseguir uma vaga.','<b>Comece pequeno e continue.</b> Um primeiro “não” faz parte do caminho; cada tentativa ensina algo.'],'y')+N('Você sabe mais do que imagina: toda habilidade conta!'),

T(2,'Antes da entrevista: prepare-se!','💡')+BX('grn','✓ O que fazer',['Pesquise sobre a empresa e leia a descrição da vaga.','Prepare exemplos reais das suas experiências, estudos ou trabalhos em grupo.','Separe o currículo e os documentos solicitados.','Escolha uma roupa limpa, confortável e adequada.','Confira horário, local e trajeto; chegue com 10 a 15 minutos de antecedência.','Deixe o celular no silencioso.','Descanse bem na noite anterior.'],'y')+BX('red','✕ O que evitar',['Chegar atrasado(a).','Ir sem conhecer minimamente a empresa.','Usar roupas muito informais (shorts, regata, chinelo).','Levar fones de ouvido ou celular ligado.','Chegar sem o currículo (se for solicitado).'],'n')+TIP('se a entrevista for on-line, teste a internet, a câmera e o áudio antes. Escolha um lugar silencioso e com boa iluminação.')+N('Quanto mais disciplinada for sua preparação, mais confiança você terá!'),

T(3,'Durante a entrevista: postura e comunicação','🤝')+BX('grn','✓ O que fazer',['Cumprimente com educação e seja cordial.','Mantenha contato visual natural e demonstre atenção.','Espere a pessoa terminar de falar; fale com clareza e em ritmo tranquilo.','Demonstre interesse pela vaga e pela empresa.','Seja sincero(a) sobre o que sabe e o que ainda precisa aprender.','Destaque habilidades e experiências relevantes para a vaga.','Se tiver dúvidas, pergunte: isso demonstra interesse.'],'y')+BX('red','✕ O que evitar',['Interromper ou responder sem ouvir a pergunta.','Mexer no celular ou se distrair.','Responder de forma monossilábica (só “sim” ou “não”).','Falar mal de antigos colegas, chefes ou empresas.','Exagerar ou inventar experiências e conhecimentos.','Usar gírias em excesso ou falar de forma agressiva.','Cruzar os braços o tempo todo ou balançar objetos por nervosismo.','Focar apenas no salário e nos benefícios.'],'n')+N('Não existe postura perfeita: demonstre atenção, respeito e interesse de maneira natural.'),

T(5,'Como lidar com o nervosismo?','🧠')+'<p class="lead">É normal sentir ansiedade! Veja dicas para se manter mais tranquilo(a):</p>'+B(['Respire fundo e devagar.','Chegue com antecedência.','Prepare-se bem para as perguntas.','Lembre-se de que a entrevista é um diálogo.','Mantenha pensamentos positivos.','Foque no que você pode oferecer.','Se precisar, peça alguns segundos para pensar.'],'y')+W('E se eu não souber responder?','<p>Seja honesto(a). Você pode dizer: “Essa é uma ótima pergunta. No momento, não tenho essa informação, mas posso buscar me atualizar sobre isso.”</p><p>O importante é manter a calma e demonstrar disposição para aprender.</p>')+S('E se eu não entender a pergunta?')+'<p>Peça, com educação, que a pessoa repita ou explique de outra forma.</p>'+S('E se eu não tiver experiência?')+'<p>Valorize cursos, projetos, atividades acadêmicas, voluntariado e habilidades relacionadas à oportunidade.</p>'+S('Perguntas para fazer ao recrutador')+B(['Quais serão as principais responsabilidades da função?','Como é a rotina da equipe e quais são os horários de trabalho?','Quais são as próximas etapas do processo seletivo?'],'y')+N('A entrevista é uma via de mão dupla. No final, agradeça pelo tempo e pela conversa!'),

function sv(f,i){try{localStorage.setItem(K+i,f.type==='checkbox'?(f.checked?'1':'0'):f.value)}catch(e){}}
F.forEach(function(f,i){f.addEventListener('input',function(){sv(f,i)});f.addEventListener('change',function(){sv(f,i)})});
$('#clr').onclick=function(){if(!confirm('Limpar todos os campos e marcações?'))return;F.forEach(function(f,i){if(f.type==='checkbox')f.checked=false;else f.value='';try{localStorage.removeItem(K+i)}catch(e){}})};
var ps=[].slice.call(book.querySelectorAll('.pg')),d=$('#dots'),pv=$('#prev'),nx=$('#next'),cur=0;
ps.forEach(function(p,i){p.style.zIndex=ps.length-i;var x=document.createElement('button');x.setAttribute('aria-label','Ir para: '+NM[i]);x.onclick=function(){go(i)};d.appendChild(x)});
function go(i){cur=Math.max(0,Math.min(ps.length-1,i));ps.forEach(function(p,k){p.classList.toggle('off',k<cur);p.inert=k!==cur;if(k===cur)p.scrollTop=0});
[].forEach.call(d.children,function(x,k){x.setAttribute('aria-current',k===cur)});pv.disabled=cur===0;nx.disabled=cur===ps.length-1}
pv.onclick=function(){go(cur-1)};nx.onclick=function(){go(cur+1)};
document.addEventListener('keydown',function(e){if(e.target.tagName==='INPUT'&&e.target.type==='text')return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
var sx=0,sy=0;
book.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
book.addEventListener('touchend',function(e){var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)go(cur+(dx<0?1:-1))},{passive:true});
var m=/^#p(\d+)$/.exec(location.hash);go(m?+m[1]:0);
</script>
</body>
</html>
